 const surfaces=receivers;

   // Intersect each exposed vertical face with the footprint, then shade that face at its own Zs.
   for(const face of s.risers||[]){

let rendered=[];function render(t=time,clean=false,target=canvas){D.setup(target,OX,OY);const c=target.getContext('2d');c.drawImage(terrain,0,0);if(grid&&!clean)for(let x=0;x<=20;x++)D.line(...D.pt(x,0),...D.pt(x,17),'#304e3325');if(grid&&!clean)for(let y=0;y<=17;y++)D.line(...D.pt(0,y),...D.pt(20,y),'#304e3325');const chosenItem=state.items.find(o=>o.id===selected);if(chosenItem&&!clean)outline(chosenItem,'#4fea7977');const rows=state.items.map(o=>({o,key:o.x+o.y+(defs[o.kind].w+defs[o.kind].d)*.75})).sort((a,b)=>a.key-b.key);if(target===canvas)rendered=[];for(const {o}of rows){const s=sprite(o,t),[x,y]=world(o.x,o.y);c.drawImage(s,Math.round(x-112),Math.round(y-112));if(target===canvas)rendered.push({o,s,x:Math.round(x-112),y:Math.round(y-112)});}if(hover&&chosen&&!clean){const g={kind:chosen,x:Math.round(hover.x*4)/4,y:Math.round(hover.y*4)/4,r:0};outline(g,bounded(g)?'#4fea7988':'#f18dad99');c.globalAlpha=.65;const [x,y]=world(g.x,g.y);c.drawImage(sprite(g,t),Math.round(x-112),Math.round(y-112));c.globalAlpha=1;} }

function tray(){const el=$('tray');el.replaceChildren();for(const f of Object.values(defs).filter(f=>f.group===tab)){const b=document.createElement('button');b.className='asset';b.dataset.kind=f.id;b.setAttribute('aria-pressed',f.id===chosen);b.title='Place '+f.name;const c=document.createElement('canvas');c.width=128;c.height=80;const s=sprite({kind:f.id,r:0},0),g=c.getContext('2d');g.imageSmoothingEnabled=false;let data=s.getContext('2d').getImageData(0,0,256,192).data,x0=256,y0=192,x1=0,y1=0;for(let y=0;y<192;y++)for(let x=0;x<256;x++)if(data[(y*256+x)*4+3]){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}const w=x1-x0+1,h=y1-y0+1,scale=Math.min(112/w,70/h,2);g.drawImage(s,x0,y0,w,h,Math.round((128-w*scale)/2),Math.round((80-h*scale)/2),Math.round(w*scale),Math.round(h*scale));const label=document.createElement('span');label.textContent=f.name;b.append(c,label);b.onclick=()=>{chosen=f.id;selected=null;message('Place '+f.name+' · click the map · Esc to cancel');ui();};el.append(b);}ui();}
canvas.addEventListener('pointerdown',e=>{if(exporting||e.button!==0)return;canvas.focus();const p=coord(e);if(chosen){const o=item(chosen,Math.round(p.x*4)/4,Math.round(p.y*4)/4);if(!bounded(o)){message('Keep the footprint inside the park.');return;}if(state.items.length>=400){message('Park limit: 400 items. Remove an item first.');return;}checkpoint();state.items.push(o);save();message(defs[o.kind].name+' placed. Click to add another.');return;}const o=hit(p);selected=o?.id||null;if(o){drag={id:o.id,x:p.x,y:p.y,ox:o.x,oy:o.y,before:snap(),moved:false};canvas.setPointerCapture(e.pointerId);message(defs[o.kind].name+' · drag to move · arrow keys to nudge');}ui();});

$('select').onclick=()=>{chosen=null;message('Select an item. Drag to move.');ui();};$('play').onclick=()=>{playing=!playing;ui();};$('grid').onclick=()=>{grid=!grid;$('grid').setAttribute('aria-pressed',grid);dirty=true;};$('roofs').onclick=()=>{checkpoint();state.interiors=!state.interiors;save();tray();};$('undo').onclick=()=>{if(!history.length)return;future.push(snap());restore(history.pop());message('Undone.');};$('redo').onclick=()=>{if(!future.length)return;history.push(snap());restore(future.pop());message('Redone.');};$('reset').onclick=()=>{checkpoint();state={items:defaults(),interiors:false};selected=null;chosen=null;time=0;save();tray();message('Original park restored. Undo to recover your layout.');};$('remove').onclick=()=>{if(!selected)return;checkpoint();state.items=state.items.filter(o=>o.id!==selected);selected=null;save();message('Item removed.');};$('rotate').onclick=()=>{const o=state.items.find(o=>o.id===selected);if(!o||!defs[o.kind].rotate)return;checkpoint();o.r=((o.r||0)+1)%4;save();};$('duplicate').onclick=()=>{const o=state.items.find(o=>o.id===selected);if(!o)return;chosen=o.kind;selected=null;ui();message('Place a copy of '+defs[o.kind].name+'.');};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));tray();});
document.addEventListener('keydown',e=>{if(exporting)return;if(e.key==='Escape'){chosen=null;selected=null;ui();}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click();}else if(e.target===canvas){if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('remove').click();}if(e.key.toLowerCase()==='r')$('rotate').click();if(e.key.toLowerCase()==='d')$('duplicate').click();if(e.key===' '){e.preventDefault();$('play').click();}const v={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,-.25],ArrowDown:[0,.25]}[e.key],o=state.items.find(o=>o.id===selected);if(v&&o){e.preventDefault();const n={...o,x:o.x+v[0],y:o.y+v[1]};if(bounded(n)){checkpoint();Object.assign(o,n);save();}}}});
function fit(){const r=canvas.parentElement.getBoundingClientRect(),scale=Math.min(r.width/640,r.height/384);canvas.style.width=Math.floor(640*scale)+'px';canvas.style.height=Math.floor(384*scale)+'px';}new ResizeObserver(fit).observe(canvas.parentElement);fit();
function tick(now){if(!previous)previous=now;if(!exporting){if(playing){time=(time+Math.min((now-previous)/1000,.1))%LOOP;dirty=true;}if(dirty){render();dirty=false;}}previous=now;requestAnimationFrame(tick);}tray();save();requestAnimationFrame(tick);
// GIF89a encoder. A fixed global palette and per-frame LZW streams keep export offline.
function lzw(pixels){let dict=new Map(),size=9,next=258,bits=0,buffer=0,out=[];function emit(code){buffer|=code<<bits;bits+=size;while(bits>=8){out.push(buffer&255);buffer>>>=8;bits-=8;}}emit(256);let prefix=pixels[0];for(let i=1;i<pixels.length;i++){const k=prefix*256+pixels[i],code=dict.get(k);if(code!==undefined){prefix=code;continue;}emit(prefix);if(next<4096){if(next===(1<<size))size++;dict.set(k,next++);}else{emit(256);dict=new Map();size=9;next=258;}prefix=pixels[i];}emit(prefix);if(next===(1<<size)&&size<12)size++;emit(257);if(bits)out.push(buffer&255);return Uint8Array.from(out);}
function paletteFor(img){const bins=new Map();for(let i=0;i<img.length;i+=4){let r=img[i]>>3,g=img[i+1]>>3,b=img[i+2]>>3,k=(r<<10)|(g<<5)|b;let a=bins.get(k);if(a){a[0]++;a[1]+=img[i];a[2]+=img[i+1];a[3]+=img[i+2];}else bins.set(k,[1,img[i],img[i+1],img[i+2]]);}const colors=[...bins.values()].sort((a,b)=>b[0]-a[0]).slice(0,256).map(a=>a.slice(1).map(v=>Math.round(v/a[0])));while(colors.length<256)colors.push([0,0,0]);const lut=new Uint8Array(32768);for(let k=0;k<32768;k++){const r=((k>>10)&31)*8+4,g=((k>>5)&31)*8+4,b=(k&31)*8+4;let best=Infinity,idx=0;for(let j=0;j<256;j++){const c=colors[j],d=(r-c[0])**2*2+(g-c[1])**2*3+(b-c[2])**2;if(d<best){best=d;idx=j;}}lut[k]=idx;}return{colors,lut};}
