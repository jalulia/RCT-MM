const cache=new Map();function sprite(o,t=0){const f=defs[o.kind],key=o.kind+':'+o.r+':'+state.interiors;if(!f.animated&&cache.has(key))return cache.get(key);const c=document.createElement('canvas');c.width=256;c.height=192;D.withSurface(c,112,112,()=>f.paint({...o,x:0,y:0},t));if(!f.animated)cache.set(key,c);return c;}

$('select').onclick=()=>{chosen=null;message('Select an item. Drag to move.');ui();};$('play').onclick=()=>{playing=!playing;ui();};$('grid').onclick=()=>{grid=!grid;$('grid').setAttribute('aria-pressed',grid);dirty=true;};$('roofs').onclick=()=>{checkpoint();state.interiors=!state.interiors;save();tray();};$('undo').onclick=()=>{if(!history.length)return;future.push(snap());restore(history.pop());message('Undone.');};$('redo').onclick=()=>{if(!future.length)return;history.push(snap());restore(future.pop());message('Redone.');};$('reset').onclick=()=>{checkpoint();state={items:defaults(),interiors:false};selected=null;chosen=null;time=0;save();tray();message('Original park restored. Undo to recover your layout.');};$('remove').onclick=()=>{if(!selected)return;checkpoint();state.items=state.items.filter(o=>o.id!==selected);selected=null;save();message('Item removed.');};$('rotate').onclick=()=>{const o=state.items.find(o=>o.id===selected);if(!o||!defs[o.kind].rotate)return;checkpoint();o.r=((o.r||0)+1)%4;save();};$('duplicate').onclick=()=>{const o=state.items.find(o=>o.id===selected);if(!o)return;chosen=o.kind;selected=null;ui();message('Place a copy of '+defs[o.kind].name+'.');};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));tray();});

// GIF89a encoder. A fixed global palette and per-frame LZW streams keep export offline.

function paletteFor(img){const bins=new Map();for(let i=0;i<img.length;i+=4){let r=img[i]>>3,g=img[i+1]>>3,b=img[i+2]>>3,k=(r<<10)|(g<<5)|b;let a=bins.get(k);if(a){a[0]++;a[1]+=img[i];a[2]+=img[i+1];a[3]+=img[i+2];}else bins.set(k,[1,img[i],img[i+1],img[i+2]]);}const colors=[...bins.values()].sort((a,b)=>b[0]-a[0]).slice(0,256).map(a=>a.slice(1).map(v=>Math.round(v/a[0])));while(colors.length<256)colors.push([0,0,0]);const lut=new Uint8Array(32768);for(let k=0;k<32768;k++){const r=((k>>10)&31)*8+4,g=((k>>5)&31)*8+4,b=(k&31)*8+4;let best=Infinity,idx=0;for(let j=0;j<256;j++){const c=colors[j],d=(r-c[0])**2*2+(g-c[1])**2*3+(b-c[2])**2;if(d<best){best=d;idx=j;}}lut[k]=idx;}return{colors,lut};}
